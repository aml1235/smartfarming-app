[variables]
NIXPACKS_PHP_VERSION = "8.2"

[phases.setup]
aptPkgs = ["php8.2-pgsql", "php8.2-pdo", "php8.2-mbstring", "php8.2-xml", "php8.2-curl", "php8.2-zip", "php8.2-bcmath"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[start]
cmd = "php artisan config:clear && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
