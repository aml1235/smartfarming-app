server {
    listen 8080;
    server_name _;

    root /var/www/html/frontend;
    index index.html;

    # Serve React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Laravel (PHP-FPM)
    location /api/ {
        root /var/www/smartfarming/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/smartfarming/public/index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Also proxy sanctum and other Laravel routes
    location /sanctum/ {
        root /var/www/smartfarming/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/smartfarming/public/index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location ~ /\.ht {
        deny all;
    }
}
