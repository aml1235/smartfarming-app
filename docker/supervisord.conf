[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx/error.log
stdout_logfile=/var/log/nginx/access.log

[program:php-fpm]
command=/usr/sbin/php-fpm8.3 -F
autostart=true
autorestart=true
stderr_logfile=/var/log/php8.3-fpm.log
stdout_logfile=/var/log/php8.3-fpm.log

[program:laravel-queue]
command=php /var/www/smartfarming/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stderr_logfile=/var/log/laravel-queue.log
stdout_logfile=/var/log/laravel-queue.log
user=www-data
